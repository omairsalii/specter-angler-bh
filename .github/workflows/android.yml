name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-v1

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html tide.js solunar.js tidepro.js visuals.js gear.js beginner.js knots3d.js motion.js manifest.webmanifest www/
          cp -r icons www/

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: App icon
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0a1626' --iconBackgroundColorDark '#0a1626' --splashBackgroundColor '#0a1626' --splashBackgroundColorDark '#0a1626' || echo "icon generation skipped"

      - name: Location permission and version number
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />#' "$M"
          grep -q ACCESS_FINE_LOCATION "$M"
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Use the project's fixed signing key (so updates install over older versions)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon || (echo "retrying after 60s"; sleep 60; ./gradlew assembleDebug --no-daemon) || (sleep 120; ./gradlew assembleDebug --no-daemon)
          cp app/build/outputs/apk/debug/app-debug.apk ../SpecterAngler-BH.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Specter Angler BH 1.${{ github.run_number }}
          make_latest: true
          files: SpecterAngler-BH.apk
          body: |
            تطبيق Specter Angler BH للأندرويد.
            حمّل ملف SpecterAngler-BH.apk من الأسفل وثبّته (اسمح بتثبيت التطبيقات من مصادر غير معروفة عند الطلب).
            رابط آخر إصدار دائماً: https://github.com/omairsalii/specter-angler-bh/releases/latest/download/SpecterAngler-BH.apk
